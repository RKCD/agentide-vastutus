  - id: too
    pealkiri: Agent teeb tööalase otsuse inimese kohta
    lühikirjeldus: >-
      Agent sõelub kandidaate, hindab töötajate tulemusi või jagab ülesandeid.
    näide: >-
      Värbamisagent jätab kõrvale kõik kandidaadid, kelle CV-s on lünk.
      Kandidaat küsib, miks ta vestlusele ei saanud.
    mida_teha:
      - >-
        Kaardista, kas süsteem sõelub kandidaate, mõjutab töösuhte otsuseid või
        jagab ülesandeid. Siis on see AI-määruse III lisa järgi suure riskiga.
      - >-
        Nimeta pädev inimene, kes vaatab üle iga negatiivse otsuse, ja pane
        tema otsus kirja.
      - >-
        Teavita kandidaate ja töötajaid AI kasutamisest ning hoia kriteeriumid
        kirjas, et suudad otsust selgitada.
      - >-
        Küsi tarnijalt dokumentatsiooni ja testi tulemusi diskrimineerimise
        kohta. Vaidluses pead sina tõendama, et diskrimineerimist ei olnud.
    normid:
      - akt: Tehisintellekti määrus (EL) 2024/1689
        säte: III lisa p 4, art 26, art 86
        mida_ütleb: >-
          Suure riskiga on AI, mida kasutatakse töölevõtmiseks või valimiseks
          (sh taotluste filtreerimine ja kandidaatide hindamine), töösuhte
          otsusteks, tööülesannete jagamiseks ning töötulemuste seireks ja
          hindamiseks (III lisa p 4). Juurutaja kasutab süsteemi kasutusjuhendi
          järgi ja annab inimjärelevalve pädevale inimesele (art 26). Mõjutatud
          isikul on õigus nõuda juurutajalt selget ja sisulist selgitust AI
          rolli kohta otsuses (art 86).
        allika_url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
        tase: EL
        staatus: kohaldub_alates
        alates: 2027-12-02
        kontrollitud: 2026-10-20
      - akt: Isikuandmete kaitse üldmäärus (EL) 2016/679 (GDPR)
        säte: art 22
        mida_ütleb: >-
          Inimesel on õigus, et tema kohta ei võetaks otsust, mis põhineb
          üksnes automatiseeritud töötlusel ja millel on õiguslikud tagajärjed
          või märkimisväärne mõju. Erandid: leping, liidu või liikmesriigi õigus
          koos kaitsemeetmetega või selgesõnaline nõusolek.
        allika_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Platvormitöö direktiiv (EL) 2024/2831
        säte: III peatükk (algoritmiline juhtimine), art 7, art 29
        mida_ütleb: >-
          Reguleerib digitaalsete tööplatvormide algoritmilist juhtimist. Näiteks
          ei tohi platvorm automaatsete seire- või otsustussüsteemidega
          töödelda platvormitöö tegija emotsionaalset seisundit ega
          eravestlustega seotud andmeid (art 7). Ülevõtmise tähtaeg on
          2.12.2026 (art 29).
        allika_url: https://eur-lex.europa.eu/eli/dir/2024/2831/oj
        tase: EL
        staatus: kohaldub_alates
        alates: 2026-12-02
        kontrollitud: 2026-10-20
      - akt: Võrdse kohtlemise seadus (VõrdKS)
        säte: § 8 (jagatud tõendamiskohustus)
        mida_ütleb: >-
          Kui inimene esitab faktid, mille alusel võib eeldada diskrimineerimist,
          peab teine pool tõendama, et ta ei rikkunud võrdse kohtlemise
          põhimõtet.
        allika_url: https://www.riigiteataja.ee/akt/117032026014?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollitud: 2026-10-20
    kes_vastutab:
      - roll: Tööandja (juurutaja)
        selgitus: >-
          Vastutab otsuse ja selle selgitamise eest kandidaadi või töötaja ees
          (AI-määrus art 86). Diskrimineerimisvaidluses kannab tõendamiskohustust
          (VõrdKS § 8).
      - roll: Süsteemi pakkuja
        selgitus: >-
          Vastutab suure riskiga süsteemi nõuetele vastavuse eest (andmed,
          dokumentatsioon, logimine).
    kuhu_teatada:
      - asutus: Andmekaitse Inspektsioon
        millal: Kui rikuti isikuandmete või GDPR art 22 õigusi.
        link: https://www.aki.ee
      - asutus: Soolise võrdõiguslikkuse ja võrdse kohtlemise volinik
        millal: Kui otsus võib olla diskrimineeriv.
        link: https://www.volinik.ee
    mida_säilitada:
      - "Agendi tegevuslogid: sõelumise kriteeriumid ja tulemused."
      - "Inimese kinnitused: kes otsuse üle vaatas ja kinnitas."
      - "Mudeli ja tööriistade (MCP-serverid, pluginad) versioonid."
      - "Suhtlus süsteemi tarnijaga."
    lahtised_küsimused:
      - >-
        Art 86 (õigus selgitusele) ei ole omnibusiga edasi lükatud sätete hulgas.
        Kas see kohaldub juba määruse üldisest kohaldamise kuupäevast
        2.08.2026, kuigi juurutaja kohustused kohalduvad alates 2.12.2027?
      - >-
        Millised töölepingu seaduse kohustused (nt töötaja teavitamine)
        kehtivad, kui tööülesandeid jagab algoritm? Kontrollimata.
      - >-
        Kes on Eestis AI-määruse järgi suure riskiga tööalaste süsteemide
        turujärelevalveasutus? Ametlikku määramist ei leidnud.
    kontrollitud: 2026-10-20
    viimati_uuendatud: 2026-10-20

  - id: turvaintsident
    pealkiri: Agent tekitab turvaintsidendi
    lühikirjeldus: >-
      Agendil on liiga laiad volitused, kaugligipääs või ta kasutab
      tööriista, mille kaudu ründaja pääseb süsteemi.
    näide: >-
      Arendusagent installib kompromiteeritud paketi ja ründaja saab ligipääsu
      ettevõtte serverile.
    normid:
      - akt: Küberturvalisuse seadus (KüTS)
        säte: § 8 (teenuseosutaja kohustus teavitada küberintsidendist)
        mida_ütleb: >-
          Teenuseosutaja esitab Riigi Infosüsteemi Ametile esmase teate
          viivitamata, kuid hiljemalt 24 tundi pärast olulise mõjuga
          küberintsidendist teada saamist.
        allika_url: https://www.riigiteataja.ee/akt/106102026002?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: NIS2 direktiiv (EL) 2022/2555
        säte: art 23
        mida_ütleb: >-
          Olulisest intsidendist esitatakse varajane hoiatus hiljemalt 24 tunni
          jooksul, intsidenditeade 72 tunni jooksul ja lõpparuanne ühe kuu
          jooksul pärast intsidenditeate esitamist.
        allika_url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Küberkerksuse määrus (EL) 2024/2847 (CRA)
        säte: art 14 (tootjate teatamiskohustused), art 71
        mida_ütleb: >-
          Digielemente sisaldava toote tootja teatab aktiivselt ärakasutatavast
          nõrkusest: eelhoiatus 24 tunni ja teavitus 72 tunni jooksul. Art 14
          kohaldub alates 11.09.2026, määrus tervikuna alates 11.12.2027.
        allika_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
    kes_vastutab:
      - roll: Agenti kasutav organisatsioon
        selgitus: >-
          Kui on KüTS-i subjekt, vastutab riskijuhtimise ja teavitamise eest.
          Volituste andmine agendile on tema otsus.
      - roll: Agendi või tööriista tootja
        selgitus: >-
          Vastutab CRA järgi nõrkustest teavitamise eest ning tootevastutuse
          kaudu puudusega toote eest.
    kuhu_teatada:
      - asutus: RIA / CERT-EE
        millal: KüTS-i subjektid hiljemalt 24 tunni jooksul. Teised vabatahtlikult.
        link: https://ria.ee/kuberturvalisus/kuberintsidentide-kasitlemine-cert-ee/kuberintsidendist-teavitamine
      - asutus: Andmekaitse Inspektsioon
        millal: Kui intsident puudutas isikuandmeid, võimaluse korral 72 tunni jooksul.
        link: https://www.aki.ee
    mida_säilitada:
      - "Agendi tegevuslogid ja süsteemilogid intsidendi ajast."
      - "Agendi volituste ja ligipääsude ulatus intsidendi hetkel."
      - "Mudeli ja tööriistade (MCP-serverid, pluginad, paketid) versioonid."
      - "Suhtlus tarnijaga ja tema turvateated."
    lahtised_küsimused:
      - >-
        Kas agendile antud liiga laiad õigused on organisatsiooni enda
        hooletus või tootja puudus (nt ebaturvalised vaikeseaded)?
      - >-
        Kas agendi kasutatav väline tööriist (MCP-server, plugin) on CRA mõttes
        eraldi toode? Avatud lähtekoodiga tarkvara, mida arendatakse väljaspool
        äritegevust, ei kuulu tootevastutuse direktiivi alla (art 2 lg 2). Kes
        vastutab siis?
    kontrollitud: 2026-10-20
    viimati_uuendatud: 2026-10-20

  - id: vale-info
    pealkiri: Agent annab vale info, millele klient tugineb
    lühikirjeldus: >-
      Klienditoe või nõustamise agent ütleb midagi valesti ja klient teeb
      selle põhjal otsuse.
    näide: >-
      Lennufirma vestlusagent lubab kliendile tagasimakset, mida
      tingimustes ei ole. Klient ostab pileti selle lubaduse alusel.
    juhtum:
      tekst: >-
        Moffatt v. Air Canada, 2024 BCCRT 149 (Kanada, Briti Columbia
        vaidlusorgan). Lennufirma vestlusrobot lubas leinasoodustust
        tagantjärele, tingimused seda ei võimaldanud. Vaidlusorgan leidis, et
        robot on osa ettevõtte veebilehest ja ettevõte vastutab kogu seal oleva
        teabe eest, olenemata sellest, kas see tuleb staatiliselt lehelt või
        vestlusrobotilt.
      allika_url: https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do
    mida_teha:
      - >-
        Kontrolli, et klient saab teada, et suhtleb AI-ga. Kui tarnija süsteem
        seda ei tee, nõua seda; see on pakkuja kohustus (AI-määrus art 50 lg 1).
      - >-
        Piira agenti ametlike tingimuste ja hinnakirjaga ning keela lubadused,
        mida tingimustes ei ole.
      - >-
        Säilita vestluste logid ja vaata vigaseid vastuseid regulaarselt üle.
      - >-
        Ära looda tingimusele „agendi vastused ei ole siduvad“. Moffatti
        juhtumis ettevõte vastutusest ei pääsenud ja tüüptingimus võib olla
        tühine (VÕS § 42).
    normid:
      - akt: Tehisintellekti määrus (EL) 2024/1689
        säte: art 50 lg 1, art 3 p 3
        mida_ütleb: >-
          Pakkujad tagavad, et inimestega vahetult suhtlema mõeldud AI-süsteem
          on projekteeritud nii, et inimesele antakse teada, et ta suhtleb
          AI-süsteemiga, välja arvatud kui see on ilmne. Pakkuja on ka see, kes
          arendab süsteemi ja võtab selle kasutusele oma nime all (art 3 p 3).
          Art 50 kohaldub alates 2.08.2026.
        allika_url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Võlaõigusseadus (VÕS)
        säte: § 42 (tüüptingimuse tühisus)
        mida_ütleb: >-
          Tüüptingimus on tühine, kui see kahjustab teist lepingupoolt
          ebamõistlikult, eelkõige kui see rikub oluliselt õiguste ja kohustuste
          tasakaalu tema kahjuks.
        allika_url: https://www.riigiteataja.ee/akt/120062026018?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Tarbijakaitseseadus (TKS)
        säte: § 14–16 (ebaausad ja eksitavad kauplemisvõtted)
        mida_ütleb: >-
          Keelab ebaausa kauplemisvõtte kasutamise (§ 14). Ebaaus on muu
          hulgas eksitav kauplemisvõte (§ 15, 16).
        allika_url: https://www.riigiteataja.ee/akt/103072026030?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollida: >-
          Paragrahvide pealkirjad on kontrollitud kehtivast tekstist (RT
          103072026030), sisu veel mitte.
      - akt: Tootevastutuse direktiiv (EL) 2024/2853
        säte: art 4, art 6
        mida_ütleb: >-
          Tarkvara on toode. Hüvitatakse surm ja tervisekahju, vara
          kahjustumine ning andmete hävitamine või laostus, kui andmeid ei
          kasutata kutsetöös. Puhtalt majanduslikku kahju (nt kallim pilet)
          selles loetelus ei ole.
        allika_url: https://eur-lex.europa.eu/eli/dir/2024/2853/oj
        tase: EL
        staatus: kohaldub_alates
        alates: 2026-12-09
        kontrollitud: 2026-10-20
    kes_vastutab:
      - roll: Agenti kasutav ettevõtja
        selgitus: >-
          Kliendi ees vastutab ettevõtja, kelle nimel agent suhtleb. Moffatti
          juhtumis ei saanud ettevõte vastutust vestlusrobotile lükata. Eesti
          kohtupraktikat ei leidnud.
      - roll: AI-süsteemi pakkuja
        selgitus: >-
          Vastutab selle eest, et inimene saab teada, et suhtleb AI-ga
          (art 50 lg 1). Kui ettevõtja ehitab agendi ise, on ta ka pakkuja.
      - roll: Agendi tarnija
        selgitus: Vastutab ettevõtja ees lepingu alusel.
    kuhu_teatada:
      - asutus: Tarbijakaitse ja Tehnilise Järelevalve Amet (TTJA)
        millal: Kui kahju sai tarbija või puudub AI-märgistus.
        link: https://ttja.ee/ariklient/ohutus/tooted-teenused/tehisintellektisusteemid
      - asutus: Finantsinspektsioon
        millal: Kui vale info puudutas finantsteenust.
        link: https://www.fi.ee
    mida_säilitada:
      - "Vestluse täielik logi koos kellaaegadega."
      - "Agendi juhised ja tingimused, mis vestluse ajal kehtisid."
      - "Kliendi kinnitused ja tema tehtud otsused."
      - "Mudeli ja tööriistade (MCP-serverid, pluginad) versioonid."
      - "Suhtlus agendi tarnijaga."
    lahtised_küsimused:
      - >-
        Eestis ei leidnud kohtulahendit, kus ettevõtja vastutus vestlusagendi
        lubaduse eest oleks läbi vaieldud. Kas Eesti kohus kohtleks seda nagu
        Moffatti juhtumis?
      - >-
        Kas ettevõtja saab vastutust piirata tingimusega „agendi vastused ei
        ole siduvad“? Tüüptingimus on tühine, kui see kahjustab teist poolt
        ebamõistlikult (VÕS § 42). Tarbija puhul võib see olla ka eksitav
        kauplemisvõte (TKS § 14–16). Kohtupraktikat agendi kohta ei leidnud.
    kontrollitud: false
    viimati_uuendatud: 2026-10-20

  - id: e-teenused
    pealkiri: Agent tegutseb inimese volitusel riigi e-teenustes
    lühikirjeldus: >-
      Agent esitab inimese nimel maksudeklaratsiooni, tasub arve või esitab
      taotluse riigi e-teenuses.
    näide: >-
      Agent esitab inimese nimel maksudeklaratsiooni, kuhu on sisestatud vale
      sissetulek. Maksuamet nõuab juurdemakset ja intressi.
    normid:
      - akt: Tsiviilseadustiku üldosa seadus (TsÜS)
        säte: § 115, 117, 118 lg 2 (esindus ja volitus)
        mida_ütleb: >-
          Esindaja tehtud tehing kehtib esindatava suhtes, kui esindaja tegi
          selle esindatava nimel ja tal oli esindusõigus (§ 115). Esindusõiguse
          võib anda volitusega (§ 117). Kui esindatav teab või peab teadma, et
          keegi tegutseb tema nimel, ja talub seda, loetakse volitus antuks
          (§ 118 lg 2).
        allika_url: https://www.riigiteataja.ee/akt/131122024048?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Maksukorralduse seadus (MKS)
        säte: § 48 (esindaja), § 85 (maksudeklaratsioon)
        mida_ütleb: >-
          Menetlusosalisel on õigus kasutada maksumenetluses esindajat;
          esindusele kohaldatakse TsÜS-i sätteid, kui MKS-ist ei tulene teisiti
          (§ 48). Maksudeklaratsioon on maksuhaldurile esitatav maksu
          arvutamise dokument, mille esitamise kohustus tuleneb seadusest
          (§ 85).
        allika_url: https://www.riigiteataja.ee/akt/116102026009?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: eIDAS-määrus (EL) nr 910/2014, muudetud määrusega (EL) 2024/1183
        säte: art 5a (Euroopa digiidentiteedikukkur)
        mida_ütleb: >-
          Iga liikmesriik teeb 24 kuu jooksul pärast vastavate rakendusaktide
          jõustumist kättesaadavaks vähemalt ühe Euroopa
          digiidentiteedikukru. Muutev määrus (EL) 2024/1183 on dateeritud
          11.04.2024.
        allika_url: https://eur-lex.europa.eu/eli/reg/2024/1183/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
