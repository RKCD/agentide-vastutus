# Agentide vastutuse kaart Eestis — andmefail
#
# Iga väide peab omama allikalinki (allika_url). build.py keeldub lehte
# ehitamast, kui mõnel normil link puudub.
#
# Väljad:
#   staatus: kehtib | kohaldub_alates | eelnõu | tühistatud | tagasi_võetud
#   alates:  kuupäev (kohustuslik, kui staatus on kohaldub_alates)
#   tase:    EL | EE
#   kontrollida: (valikuline) mida Robert peab esmaallikast üle vaatama
#   kontrollitud: false | YYYY-MM-DD   (vaikimisi false)

meta:
  pealkiri: Agentide vastutuse kaart Eestis
  alapealkiri: >-
    Millised Eesti ja EL-i normid rakenduvad, kui AI-agent eksib, kes vastutab
    ja kuhu teatada. Ülevaade on koostatud olukordade, mitte seaduste kaupa.
  versioon: "0.3"
  viimati_uuendatud: 2026-10-20
  keel: et
  autor:
    nimi: Robert Kond
    taust: >-
      Osales ministeeriumis EL-i töögruppides ja õigusaktide ülevõtmisel
      (kliima- ja taastuvenergiavaldkond). Ehitab Claude'i agente EL-i
      regulatsiooni jaoks.
    kontakt: acceleratedigitaltwin@gmail.com

# Täidab Tõlk-agent (Etapp 3). Tühi loend = kuvatakse v0.1 märge.
nadala_muutused: []

# Lehe algus, olukordade kohal.
kahju_korral:
  pealkiri: Kui agent tegi sulle kahju
  sammud:
    - pealkiri: Säilita tõendid
      tekst: >-
        Logid, kuvatõmmised, kinnitused ja kirjavahetus. Vaata iga olukorra
        juures plokki "Mida säilitada kohe".
    - pealkiri: Pöördu esmalt ettevõtte või asutuse poole
      tekst: >-
        Kirjelda juhtunut kirjalikult sellele, kelle teenuses kahju tekkis, ja
        küsi vastust.
    - pealkiri: Seejärel pöördu järelevalve poole
      tekst: >-
        Kui vastust ei tule või see ei rahulda, vaata olukorra juures plokki
        "Kuhu teatada".
  hoiatus: >-
    Ükski asutus ei küsi sinult agendi volituse kinnitamist lingi, e-kirja või
    SMS-i kaudu. Kasuta ainult lehel lingitud ametlikke aadresse.

# Lehe lõpp, enne tausta. Õigusnormile viitaval punktil on allikas.
juurutaja_kontroll:
  - tekst: >-
      Anna agendile ainult need õigused ja volitused, mida ülesanne vajab, ja
      vaata need regulaarselt üle.
  - tekst: >-
      Säilita agendi tegevuslogid ja nimeta, kes neid loeb ja kui tihti.
  - tekst: >-
      Nimeta, kes otsustab intsidendist teatamise üle ja teatab (AKI 72 tunni
      jooksul, RIA 24 tunni jooksul, vajadusel Finantsinspektsioon).
    allika_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - tekst: >-
      Lepi tarnijaga kirjalikult kokku vastutus, intsidentidest teavitamine ja
      ligipääs logidele.
  - tekst: >-
      Kui agent töötleb isikuandmeid, kasuta ainult tarnijat, kes annab piisava
      tagatise nõuetekohaseks töötlemiseks, ja sõlmi temaga GDPR art 28 kohane
      leping.
    allika_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - tekst: >-
      Kontrolli, et inimene saab teada, et suhtleb AI-ga. AI-määruse art 50
      lg 1 on pakkuja kohustus. Kui ehitad agendi ise ja võtad selle kasutusele
      oma nime all, oled ise pakkuja (art 3 p 3).
    allika_url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - tekst: >-
      Anna suure riskiga otsustes (nt töö, avalikud teenused) inimjärelevalve
      pädevale ja volitatud inimesele (AI-määrus art 26 lg 2; GDPR art 22).
    allika_url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - tekst: >-
      Ära anna agendile oma maksevahendit ega isikustatud turvavolitusi ilma
      selge volituse ja piiranguteta. Kasutaja peab astuma kõik vajalikud
      sammud nende turvaliseks hoidmiseks (PSD2 art 69 lg 2).
    allika_url: https://eur-lex.europa.eu/eli/dir/2015/2366/oj
  - tekst: >-
      Pea nimekirja agendi välistest tööriistadest (MCP-serverid, pluginad) ja
      nende versioonidest.
  - tekst: >-
      Harjuta intsidenti vähemalt kord aastas: kes mida teeb esimese 24 ja 72
      tunni jooksul.

# Üldised taustanormid, mis puudutavad kõiki olukordi.
taust:
  - akt: Tehisintellekti määrus (EL) 2024/1689
    säte: art 113 (jõustumine ja kohaldamine), art 3 p 3–4 (pakkuja, juurutaja)
    mida_ütleb: >-
      Määrus jõustus 1.08.2024. I ja II peatükki (sh keelatud tavad)
      kohaldatakse alates 2.02.2025, V peatükki (üldotstarbelised mudelid)
      alates 2.08.2025, ülejäänut alates 2.08.2026. Pakkuja on see, kes arendab
      AI-süsteemi ja laseb selle turule või võtab kasutusele oma nime või
      kaubamärgi all, tasu eest või tasuta. Juurutaja on see, kes kasutab
      AI-süsteemi oma volituste alusel.
    allika_url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    tase: EL
    staatus: kehtib
    kontrollitud: 2026-10-20
  - akt: Digi-omnibus AI kohta, määrus (EL) 2026/1744
    säte: AI-määruse art 113 ja art 4 muudatused
    mida_ütleb: >-
      Lükkab suure riskiga süsteemide nõuded edasi: III lisa süsteemid (nt töö,
      haridus, avalikud teenused) 2.12.2027, I lisa tooted 2.08.2028. Määrus on
      dateeritud 8.07.2026, avaldati ELT-s 24.07.2026 ja jõustus kolmandal
      päeval pärast avaldamist (27.07.2026). Juba enne 2.08.2026 turule lastud
      generatiivse AI märgistamiseks (art 50 lg 2) on neljakuuline
      üleminekuaeg. Art 4 (AI-pädevus) muudeti: pakkujad ja juurutajad peavad
      võtma meetmeid oma töötajate AI-pädevuse toetamiseks.
    allika_url: https://eur-lex.europa.eu/eli/reg/2026/1744/oj
    tase: EL
    staatus: kehtib
    kontrollitud: 2026-10-20
  - akt: AI vastutuse direktiivi ettepanek (COM(2022) 496)
    säte: kogu ettepanek (2022/0303 (COD))
    mida_ütleb: >-
      Ettepanekut ei võetud kunagi vastu. Komisjon võttis selle tagasi,
      teade avaldati ELT-s 6.10.2025 (C/2025/5423). Praegu jääb
      lepinguväline vastutus riigisisese õiguse ja uue tootevastutuse
      direktiivi kanda.
    allika_url: https://eur-lex.europa.eu/legal-content/ET/TXT/?uri=CELEX:52025XC05423
    tase: EL
    staatus: tagasi_võetud
    kontrollitud: 2026-10-20
  - akt: Tootevastutuse direktiiv (EL) 2024/2853
    säte: art 1, 2, 4, 5, 6, 21, 22
    mida_ütleb: >-
      Tarkvara on toode (art 4). Kohaldub toodetele, mis lastakse turule või
      võetakse kasutusele pärast 9.12.2026; varasematele toodetele kehtib edasi
      vana direktiiv 85/374/EMÜ (art 2, 21). Hüvitist saavad nõuda füüsilised
      isikud (art 5). Kahju hõlmab surma ja tervisekahju, vara kahjustumist
      ning andmete hävitamist või laostust, kui andmeid ei kasutata kutsetöös
      (art 6). Ei kohaldu vabale ja avatud lähtekoodiga tarkvarale, mida
      arendatakse või tarnitakse väljaspool äritegevust (art 2 lg 2).
      Ülevõtmise tähtaeg 9.12.2026 (art 22).
    allika_url: https://eur-lex.europa.eu/eli/dir/2024/2853/oj
    tase: EL
    staatus: kohaldub_alates
    alates: 2026-12-09
    kontrollitud: 2026-10-20
  - akt: Võlaõigusseaduse muutmise eelnõu (tootevastutus)
    säte: VÕS tootevastutuse sätted (§ 1061 jj)
    mida_ütleb: >-
      Justiits- ja Digiministeerium on koostanud eelnõu uue tootevastutuse
      direktiivi ülevõtmiseks. Kehtiv VÕS § 1063 loeb tooteks juba praegu
      ka arvutitarkvara.
    allika_url: https://www.e-kaubanduseliit.ee/uudised/puudusega-toote-eest-vastutavate-ettevotjate-ring-laieneb
    tase: EE
    staatus: eelnõu
    kontrollida: >-
      Eelnõu esmaallikat (EIS-i kirjet) ei leitud, link on teisene. VÕS § 1063
      on kontrollitud kehtivast tekstist (RT 120062026018).

stsenaariumid:

  - id: tehing
    pealkiri: Agent teeb kliendi nimel tehingu, mis läheb valesti
    lühikirjeldus: >-
      Agent tellib, ostab või maksab kellegi nimel ja teeb seda valesti: vale
      kogus, vale hind, tehing, mida klient ei soovinud.
    näide: >-
      Ettevõtte ostuagent tellib tarnijalt 1000 ühikut 100 asemel. Tarnija
      nõuab tasu. Ettevõte ütleb, et ta ei soovinud seda tellimust.
    mida_teha:
      - >-
        Pane agendile tehingu- ja summalimiidid ning nõua üle piiri inimese
        kinnitust.
      - >-
        Ära anna agendile oma maksevahendit ega sisselogimisandmeid. Kasuta
        eraldi, piiratud volitusi.
      - >-
        Lepi agendi tarnijaga kirjalikult kokku, kes vastutab vale tellimuse
        eest ja kui kiiresti vead parandatakse.
      - Nimeta inimene, kes vaatab agendi tehingud üle ja tühistab vead.
    normid:
      - akt: Tsiviilseadustiku üldosa seadus (TsÜS)
        säte: § 115, 117, 118 lg 2, 129 (esindus)
        mida_ütleb: >-
          Esindaja tehtud tehing kehtib esindatava suhtes, kui esindaja tegi
          selle esindatava nimel ja tal oli esindusõigus (§ 115). Esindusõiguse
          võib anda tehinguga, st volitusega (§ 117). Kui teine pool usub
          mõistlikult, et volitus on antud, ning esindatav teab või peab
          teadma ja talub esindaja tegevust, loetakse volitus antuks (§ 118
          lg 2). Esindusõiguseta tehtud mitmepoolne tehing on tühine, kui
          esindatav seda heaks ei kiida (§ 129).
        allika_url: https://www.riigiteataja.ee/akt/131122024048?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Võlaõigusseadus (VÕS)
        säte: § 103 (rikkumise vabandatavus), § 115 (kahju hüvitamine)
        mida_ütleb: >-
          Võlgnik vastutab kohustuse rikkumise eest, välja arvatud kui rikkumine
          on vabandatav; eeldatakse, et rikkumine ei ole vabandatav (§ 103).
          Kohustuse rikkumisel võib võlausaldaja nõuda kahju hüvitamist (§ 115).
        allika_url: https://www.riigiteataja.ee/akt/120062026018?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Makseteenuste direktiiv (EL) 2015/2366 (PSD2)
        säte: art 64, 69, 73, 74
        mida_ütleb: >-
          Maksetehing on autoriseeritud ainult siis, kui maksja on andnud
          nõusoleku (art 64). Makse kasutaja peab kasutama makseinstrumenti
          tingimuste kohaselt, teatama selle kadumisest või väärkasutusest
          liigse viivituseta ja astuma kõik vajalikud sammud isikustatud
          turvavolituste turvaliseks hoidmiseks (art 69). Autoriseerimata makse
          tagastab makseteenuse pakkuja hiljemalt järgmise tööpäeva lõpuks
          (art 73). Maksja kannab kahju kuni 50 euro ulatuses. Kogu kahju kannab
          ta, kui ta pani toime pettuse või jättis art 69 kohustused täitmata
          kavatsetult või raske hooletuse tõttu (art 74 lg 1; eestikeelses
          tekstis on „hooletusest“, ingliskeelses „gross negligence“). Kui
          makseteenuse pakkuja ei nõudnud tugevat kliendi autentimist, ei kanna
          maksja kahju, välja arvatud pettuse korral (art 74 lg 2).
        allika_url: https://eur-lex.europa.eu/eli/dir/2015/2366/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Tootevastutuse direktiiv (EL) 2024/2853
        säte: art 1, 5, 6
        mida_ütleb: >-
          Hüvitist saavad nõuda ainult füüsilised isikud ja kahju alla ei kuulu
          üksnes kutsetöös kasutatav vara. Ettevõtte ostuagendi vea korral
          (B2B) direktiiv kahju hüvitamist ei võimalda.
        allika_url: https://eur-lex.europa.eu/eli/dir/2024/2853/oj
        tase: EL
        staatus: kohaldub_alates
        alates: 2026-12-09
        kontrollitud: 2026-10-20
    kes_vastutab:
      - roll: Agendi kasutaja (kelle nimel tehing tehti)
        selgitus: >-
          Kui agent tegutses kasutaja nimel ja kasutaja teab ning talub seda,
          võib teine pool tugineda näilisele volitusele (TsÜS § 118 lg 2) ja
          tehing seob kasutajat. Kas TsÜS-i esindussätteid saab agendile, mis
          ei ole isik, üldse kohaldada, on lahtine.
      - roll: Agendi teenuse osutaja
        selgitus: >-
          Vastutab kasutaja ees lepingu alusel, kui agent ei toiminud
          kokkulepitult, välja arvatud kui rikkumine on vabandatav (VÕS § 103).
      - roll: Makseteenuse pakkuja
        selgitus: >-
          Tagastab autoriseerimata makse (PSD2 art 73). Kui ta ei nõudnud tugevat
          autentimist, jääb kahju talle (art 74 lg 2).
      - roll: Kasutaja, kes andis agendile oma maksevahendi või sisselogimisandmed
        selgitus: >-
          Kui see tähendab, et ta ei astunud vajalikke samme turvavolituste
          kaitseks (PSD2 art 69 lg 2) ja tegi seda kavatsetult või raske
          hooletuse tõttu, võib kogu kahju jääda talle (art 74 lg 1). Kas
          volituse andmine agendile on selline rikkumine, on lahtine.
    kuhu_teatada:
      - asutus: Finantsinspektsioon
        millal: Kui tehing puudutab finantsteenust või makset.
        link: https://www.fi.ee
      - asutus: Tarbijakaitse ja Tehnilise Järelevalve Amet (TTJA)
        millal: Kui kahju sai tarbija.
        link: https://ttja.ee
    mida_säilitada:
      - "Agendi tegevuslogid: päringud, tellimused, vastused ja kellaajad."
      - "Volituse ja maksevahendi ulatus ning kehtivus tehingu hetkel."
      - "Kasutaja kinnitused: mida ja millal kinnitati."
      - "Mudeli ja tööriistade (MCP-serverid, pluginad) versioonid."
      - "Suhtlus tarnija, müüja ja makseteenuse pakkujaga."
    lahtised_küsimused:
      - >-
        Kas agendi tehtud tahteavaldust saab lugeda kasutaja enda
        tahteavalduseks või kohaldub esindus analoogia korras? Eesti
        kohtupraktikat ei leidnud.
      - >-
        Kas makse, mille agent algatas kasutaja üldise volituse alusel, on
        PSD2 mõttes autoriseeritud, kui konkreetne summa oli vale?
      - >-
        PSD2 art 74 eesti- ja ingliskeelne tekst erinevad („hooletusest“ vs
        „gross negligence“). Kuidas on see VÕS-is üle võetud?
      - Kas teine pool peab teadma, et suhtleb agendiga, ja mis juhtub, kui ei tea?
    kontrollitud: 2026-10-20
    viimati_uuendatud: 2026-10-20

  - id: isikuandmed
    pealkiri: Agent töötleb või lekitab isikuandmeid
    lühikirjeldus: >-
      Agent saab ligipääsu isikuandmetele ja kasutab neid valel eesmärgil või
      saadab need valele saajale.
    näide: >-
      Klienditoe agent saadab vastuse koos teise kliendi lepingu andmetega
      valele e-posti aadressile.
    normid:
      - akt: Isikuandmete kaitse üldmäärus (EL) 2016/679 (GDPR)
        säte: art 28 lg 1–2 (volitatud töötleja)
        mida_ütleb: >-
          Vastutav töötleja kasutab ainult volitatud töötlejaid, kes annavad
          piisava tagatise, et töötlemine vastab määruse nõuetele. Volitatud
          töötleja ei kaasa teist volitatud töötlejat ilma vastutava töötleja
          eelneva kirjaliku loata.
        allika_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Isikuandmete kaitse üldmäärus (EL) 2016/679 (GDPR)
        säte: art 33, art 34
        mida_ütleb: >-
          Vastutav töötleja teatab rikkumisest järelevalveasutusele
          põhjendamatu viivituseta ja võimaluse korral 72 tunni jooksul pärast
          teada saamist, välja arvatud kui oht inimestele on ebatõenäoline.
          Volitatud töötleja teavitab vastutavat töötlejat põhjendamatu
          viivituseta (art 33). Kui oht inimestele on tõenäoliselt suur, tuleb
          teavitada ka neid (art 34).
        allika_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Isikuandmete kaitse üldmäärus (EL) 2016/679 (GDPR)
        säte: art 82
        mida_ütleb: >-
          Inimesel, kes kandis rikkumise tõttu materiaalset või mittemateriaalset
          kahju, on õigus saada hüvitist vastutavalt või volitatud töötlejalt.
          Volitatud töötleja vastutab ainult siis, kui ta ei täitnud talle
          suunatud nõudeid või tegutses vastutava töötleja seaduslike juhiste
          vastaselt.
        allika_url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
        tase: EL
        staatus: kehtib
        kontrollitud: 2026-10-20
      - akt: Isikuandmete kaitse seadus (IKS)
        säte: üldsätted, järelevalve
        mida_ütleb: >-
          Täpsustab GDPR-i rakendamist Eestis. Järelevalvet teeb Andmekaitse
          Inspektsioon.
        allika_url: https://www.riigiteataja.ee/akt/130062026052?leiaKehtiv
        tase: EE
        staatus: kehtib
        kontrollida: >-
          Kehtiv redaktsioon on leitud (RT 130062026052), sätet pole veel
          loetud. Kontrolli järelevalve paragrahv.
    kes_vastutab:
      - roll: Vastutav töötleja (agenti kasutav organisatsioon)
        selgitus: Vastutab rikkumise ja teatamise eest (GDPR art 33, 82).
      - roll: Volitatud töötleja (agendi pakkuja)
        selgitus: >-
          Vastutab, kui rikkus talle suunatud nõudeid või tegutses juhiste
          vastaselt (art 82 lg 2). Peab vastutavat töötlejat rikkumisest
          põhjendamatu viivituseta teavitama (art 33 lg 2).
    kuhu_teatada:
      - asutus: Andmekaitse Inspektsioon
        millal: Võimaluse korral 72 tunni jooksul pärast teada saamist.
        link: https://www.aki.ee
    mida_säilitada:
      - "Agendi tegevuslogid: milliseid andmeid töödeldi ja kellele saadeti."
      - "Agendi ligipääsuõiguste ulatus intsidendi hetkel."
      - "Rikkumise avastamise aeg (72 tunni tähtaja jaoks)."
      - "Mudeli ja tööriistade (MCP-serverid, pluginad) versioonid."
      - "Suhtlus tarnijaga (volitatud töötleja teavitus)."
    lahtised_küsimused:
      - >-
        Kui agent kasutab väliseid tööriistu (MCP-serverid, pluginad), kes on
        nende tööriistade pakkuja GDPR-i mõttes? Volitatud töötleja,
        alamtöötleja (art 28 lg 2) või eraldi vastutav töötleja?
      - >-
        Millal on organisatsioon rikkumisest „teada saanud“, kui rikkumine on
        näha ainult agendi logides, mida keegi ei loe?
    kontrollitud: false
    viimati_uuendatud: 2026-10-20

  - id: avalik-sektor
    pealkiri: Agent osaleb avaliku sektori otsuses
    lühikirjeldus: >-
      Agent valmistab ette või teeb haldusotsuse: toetus, luba, menetluse
      käik.
    näide: >-
      Toetuse taotlus lükatakse tagasi automaatselt, sest agent luges
      taotluse lisa valesti.
    normid:
      - akt: Haldusmenetluse seaduse ja avaliku teabe seaduse muutmise seadus
        säte: HMS § 7¹ (automaatne haldusmenetlus); RT I, 09.07.2026, 12
        mida_ütleb: >-
          Haldusorgan võib anda haldusakti või teha toimingu automaatselt, ilma
          ametniku vahetu sekkumiseta (lg 1). Kaalutlusotsust tohib nii teha
          ainult eriseaduses ettenähtud juhul (lg 2). Menetlusosalisel on õigus
          isiklikule kontaktile ja ärakuulamisele; selle kasutamisel automaatne
          menetlus lõpeb (lg 3). Haldusaktis märgitakse, et see on antud
          automaatselt (lg 4), ja põhjendus selgitab otsustuspõhimõtteid ja
          kriteeriume (lg 6). Seadus jõustub 1.01.2027, § 7¹ kohaldub
          menetlustele, mis algatatakse alates 1.07.2027.
        allika_url: https://www.riigiteataja.ee/akt/109072026012
        tase: EE
        staatus: kohaldub_alates
        alates: 2027-07-01
