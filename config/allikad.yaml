# Radari allikad. Lihtne muuta: lisa/eemalda kirje, pane `lubatud: false`, et peatada.
#
# tüüp:
#   rss   - RSS või Atom voog (url on voo aadress)
#   html  - tavaline leht; Radar võtab sealt välja piisavalt pikad lingid
#
# NB! Ühtegi allikat pole siit keskkonnast veel kontrollida saanud (võrk blokeeritud).
# Kontrolli neid GitHub Actionsis: Actions -> Radar -> Run workflow -> toiming: kontrolli_allikaid.
# Mittetöötavad märgi `lubatud: false` ja kirjuta põhjus märkusesse.

allikad:
  - id: riigiteataja
    nimi: Riigi Teataja
    tüüp: html
    url: https://www.riigiteataja.ee/
    tase: EE
    lubatud: false
    märkus: >-
      Kontrollitud 19.10.2026 Actionsis: avalehelt ei tule HTML-ist ühtegi piisavalt pikka linki (0 kirjet). Vajab muud lehte või RSS-i, aadress teadmata.

  - id: eelnoud
    nimi: Eelnõude infosüsteem
    tüüp: html
    url: https://eelnoud.valitsus.ee/main
    tase: EE
    lubatud: false
    märkus: >-
      Kontrollitud 19.10.2026 Actionsis: 0 kirjet, leht vajab tõenäoliselt JavaScripti. Vajab RSS-i või API-d, aadress teadmata.

  - id: ria
    nimi: RIA uudised
    tüüp: html
    url: https://www.ria.ee/uudised
    tase: EE
    lubatud: false
    märkus: >-
      Kontrollitud 19.10.2026 Actionsis: https://www.ria.ee/uudised annab 404. Õige uudiste aadress teadmata.

  - id: aki
    nimi: Andmekaitse Inspektsioon
    tüüp: html
    url: https://www.aki.ee/
    tase: EE
    lubatud: true

  - id: ttja-ai
    nimi: TTJA tehisintellektisüsteemid
    tüüp: html
    url: https://ttja.ee/ariklient/ohutus/tooted-teenused/tehisintellektisusteemid
    tase: EE
    lubatud: true

  - id: edpb
    nimi: EDPB
    tüüp: html
    url: https://www.edpb.europa.eu/
    tase: EL
    lubatud: true
    märkus: Avaleht. Uudiste lehe täpne aadress kontrollimata.

  - id: eurlex
    nimi: EUR-Lex (uued õigusaktid)
    tüüp: rss
    url: ""
    tase: EL
    lubatud: false
    märkus: >-
      EUR-Lexi RSS-voo loob kasutaja ise EUR-Lexi kontol (otsing -> RSS). Lisa siia
      selle voo aadress ja pane lubatud: true.

  - id: aruaid
    nimi: Aruaid projekti leht
    tüüp: html
    url: ""
    tase: EE
    lubatud: false
    märkus: Aadress teadmata. Lisa, kui see on olemas.

  - id: ec-ai-office
    nimi: Euroopa Komisjon, AI Office ja digistrateegia
    tüüp: html
    url: ""
    tase: EL
    lubatud: false
    märkus: Uudiste lehe aadress kontrollimata. Lisa, kui see on olemas.

# Proovid: aadressid, mida allikakontroll ainult mõõdab (Radar neid ei loe).
# Eesmärk on teada saada, kas ametlik API või ELI-link töötab paremini kui HTML-leht.
proovid:
  - id: proov-rt-api
    url: https://www.riigiteataja.ee/public-api/api/v1/akt/131122024048/txt
    märkus: Riigi Teataja avalik API, TsÜS tekst (aadress pärineb veebiotsingust)
  - id: proov-rt-akt
    url: https://www.riigiteataja.ee/akt/109072026012
    märkus: Riigi Teataja akti leht, HMS muutmise seadus
  - id: proov-eurlex-eli
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    märkus: EUR-Lex ELI-link, AI-määrus
