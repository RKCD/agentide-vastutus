name: Loe esmaallikat

# Käsitsi: loeb avalikud õigustekstid ja prindib otsitud lõigud logisse.
# Kasutatakse kaardi väidete kontrollimiseks. Väljund salvestub harusse
# kontrolli-logid (fail <jooksu nr>.txt), main-i ei muudeta.
on:
  workflow_dispatch:
    inputs:
      urlid:
        description: "Tühikuga eraldatud URL-id"
        required: true
      otsi:
        description: "Regexid, eraldatud ' || '-ga (tühi = ainult algus)"
        default: ""
      algus:
        description: "Prindi teksti algusest N märki"
        default: "0"
      konteksti:
        description: "Märke vaste ümber"
        default: "600"
      toores:
        description: "Otsi toorest vastusest (1 = jah)"
        default: "0"
      keel:
        description: "Accept-Language"
        default: "et, est;q=0.9, en;q=0.5"

permissions:
  contents: write

jobs:
  loe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agents.txt
      - run: pip install -r requirements-agents.txt pypdf==5.1.0
      - name: Loe
        env:
          URLID: ${{ inputs.urlid }}
          OTSI: ${{ inputs.otsi }}
          ALGUS: ${{ inputs.algus }}
          KEEL: ${{ inputs.keel }}
          TOORES: ${{ inputs.toores }}
          KONTEKSTI: ${{ inputs.konteksti }}
        run: |
          args=()
          [ "$TOORES" = "1" ] && args+=(--toores)
          if [ -n "$OTSI" ]; then
            while IFS= read -r m || [ -n "$m" ]; do [ -n "$m" ] && args+=(--otsi "$m"); done < <(printf '%s' "$OTSI" | sed 's/ || /\n/g')
          fi
          # shellcheck disable=SC2086
          python agents/allikas.py $URLID --algus "$ALGUS" --keel "$KEEL" --konteksti "${KONTEKSTI:-600}" "${args[@]}" | tee /tmp/valjund.txt
      - name: Salvesta väljund harusse kontrolli-logid
        env:
          NR: ${{ github.run_number }}
          URLID: ${{ inputs.urlid }}
          OTSI: ${{ inputs.otsi }}
        run: |
          git config user.name "kontroll[bot]"
          git config user.email "kontroll-bot@users.noreply.github.com"
          git fetch origin kontrolli-logid || true
          if git rev-parse --verify -q origin/kontrolli-logid >/dev/null; then
            git switch -c kontrolli-logid origin/kontrolli-logid
          else
            git switch --orphan kontrolli-logid
          fi
          { echo "# jooks $NR"; echo "# urlid: $URLID"; echo "# otsi: $OTSI"; cat /tmp/valjund.txt; } > "$NR.txt"
          git add "$NR.txt"
          git commit -q -m "kontroll $NR"
          for i in 1 2 3 4 5; do
            git push -q origin kontrolli-logid && exit 0
            sleep $((i * 3)); git pull -q --rebase origin kontrolli-logid
          done
          exit 1
